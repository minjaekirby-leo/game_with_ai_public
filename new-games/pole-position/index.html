<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏎️ 폴 포지션 - 서민재의 게임랜드</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #87CEEB, #98FB98);
            color: #000;
            overflow: hidden;
            height: 100vh;
        }

        .game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #87CEEB 0%, #87CEEB 40%, #228B22 40%, #228B22 100%);
        }

        .hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            color: #000;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.8);
            z-index: 100;
        }

        .controls {
            position: absolute;
            top: 50px;
            left: 10px;
            color: #000;
            font-size: 14px;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.8);
            z-index: 100;
        }

        .back-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.8);
            color: #000;
            border: 2px solid #000;
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 1);
            transform: translateY(-2px);
        }

        canvas {
            display: block;
            background: linear-gradient(to bottom, #87CEEB 40%, #228B22 40%);
            border: 3px solid #000;
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            color: #000;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            border: 3px solid #000;
            display: none;
            z-index: 200;
        }

        .speedometer {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 120px;
            height: 120px;
            border: 3px solid #000;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            z-index: 100;
        }

        .speed-needle {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 2px;
            height: 50px;
            background: #ff0000;
            transform-origin: bottom center;
            transform: translate(-50%, -100%) rotate(0deg);
            transition: transform 0.1s;
        }

        .speed-text {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-weight: bold;
            font-size: 12px;
        }

        .lap-info {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 10px;
            border: 2px solid #000;
            font-weight: bold;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <a href="../../index.html" class="back-btn">🏠 홈으로</a>
        
        <div class="hud">
            <div>점수: <span id="score">0</span></div>
            <div>🏎️ 폴 포지션</div>
            <div>시간: <span id="time">0</span>초</div>
        </div>

        <div class="controls">
            조작법: 화살표 키 - 조향 및 가속/감속
        </div>

        <div class="lap-info">
            랩: <span id="currentLap">1</span> / 3 | 위치: <span id="position">1</span>위
        </div>

        <div class="speedometer">
            <div class="speed-needle" id="speedNeedle"></div>
            <div class="speed-text">KM/H</div>
            <div style="position: absolute; top: 10px; left: 50%; transform: translateX(-50%); font-size: 10px;">200</div>
            <div style="position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); font-size: 10px;">0</div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div class="game-over" id="gameOver">
            <h2>레이스 완료!</h2>
            <p>최종 시간: <span id="finalTime">0</span>초</p>
            <p>최종 위치: <span id="finalPosition">1</span>위</p>
            <p>최종 점수: <span id="finalScore">0</span></p>
            <button onclick="restartGame()" style="background: #228B22; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 15px;">다시 시작</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // 캔버스 크기 설정
        canvas.width = 800;
        canvas.height = 600;
        canvas.style.position = 'absolute';
        canvas.style.left = '50%';
        canvas.style.top = '50%';
        canvas.style.transform = 'translate(-50%, -50%)';

        // 게임 상태
        let gameState = {
            score: 0,
            time: 0,
            currentLap: 1,
            totalLaps: 3,
            position: 1,
            gameRunning: true,
            keys: {},
            raceFinished: false,
            trackProgress: 0 // 0-1, 트랙 진행도
        };

        // 플레이어 자동차
        class Player {
            constructor() {
                this.x = canvas.width / 2;
                this.y = canvas.height - 100;
                this.width = 20;
                this.height = 40;
                this.speed = 0;
                this.maxSpeed = 8;
                this.acceleration = 0.2;
                this.deceleration = 0.1;
                this.turnSpeed = 0;
                this.maxTurnSpeed = 3;
                this.angle = 0;
                this.color = '#ff0000';
            }

            update() {
                // 가속/감속 처리
                if (gameState.keys['ArrowUp']) {
                    this.speed = Math.min(this.maxSpeed, this.speed + this.acceleration);
                } else if (gameState.keys['ArrowDown']) {
                    this.speed = Math.max(-this.maxSpeed/2, this.speed - this.acceleration);
                } else {
                    // 자연 감속
                    if (this.speed > 0) {
                        this.speed = Math.max(0, this.speed - this.deceleration);
                    } else if (this.speed < 0) {
                        this.speed = Math.min(0, this.speed + this.deceleration);
                    }
                }

                // 조향 처리 (속도에 비례)
                const speedFactor = Math.abs(this.speed) / this.maxSpeed;
                if (gameState.keys['ArrowLeft']) {
                    this.turnSpeed = Math.max(-this.maxTurnSpeed, this.turnSpeed - 0.3);
                } else if (gameState.keys['ArrowRight']) {
                    this.turnSpeed = Math.min(this.maxTurnSpeed, this.turnSpeed + 0.3);
                } else {
                    this.turnSpeed *= 0.8; // 조향 감쇠
                }

                // 각도 업데이트
                this.angle += this.turnSpeed * speedFactor * 0.02;

                // 위치 업데이트
                this.x += Math.sin(this.angle) * this.speed;
                this.y -= Math.cos(this.angle) * this.speed;

                // 트랙 경계 처리
                const trackLeft = canvas.width / 2 - 150;
                const trackRight = canvas.width / 2 + 150;
                
                if (this.x < trackLeft) {
                    this.x = trackLeft;
                    this.speed *= 0.5; // 충돌 시 속도 감소
                }
                if (this.x > trackRight) {
                    this.x = trackRight;
                    this.speed *= 0.5;
                }

                // 트랙 진행도 업데이트
                if (this.y < 50) {
                    gameState.trackProgress += 0.01;
                    this.y = canvas.height - 100; // 화면 아래로 리셋
                    
                    if (gameState.trackProgress >= 1) {
                        gameState.currentLap++;
                        gameState.trackProgress = 0;
                        
                        if (gameState.currentLap > gameState.totalLaps) {
                            finishRace();
                        }
                    }
                }

                // 속도계 업데이트
                const speedPercent = (Math.abs(this.speed) / this.maxSpeed) * 100;
                const needleAngle = (speedPercent / 100) * 180 - 90;
                document.getElementById('speedNeedle').style.transform = 
                    `translate(-50%, -100%) rotate(${needleAngle}deg)`;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // 자동차 몸체
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);

                // 자동차 창문
                ctx.fillStyle = '#87CEEB';
                ctx.fillRect(-this.width/2 + 3, -this.height/2 + 5, this.width - 6, 15);

                // 자동차 바퀴
                ctx.fillStyle = '#000';
                ctx.fillRect(-this.width/2 - 2, -this.height/2 + 5, 4, 8);
                ctx.fillRect(this.width/2 - 2, -this.height/2 + 5, 4, 8);
                ctx.fillRect(-this.width/2 - 2, this.height/2 - 13, 4, 8);
                ctx.fillRect(this.width/2 - 2, this.height/2 - 13, 4, 8);

                ctx.restore();
            }
        }

        // AI 자동차
        class AICar {
            constructor(x, y, color, speed) {
                this.x = x;
                this.y = y;
                this.width = 18;
                this.height = 35;
                this.speed = speed;
                this.baseSpeed = speed;
                this.color = color;
                this.angle = 0;
                this.lane = Math.floor((x - (canvas.width/2 - 150)) / 75); // 차선
                this.progress = Math.random();
            }

            update() {
                // AI 이동 (단순한 직선 주행)
                this.y += this.speed;
                
                // 화면을 벗어나면 위쪽에서 다시 나타남
                if (this.y > canvas.height + 50) {
                    this.y = -50;
                    this.progress += 0.1;
                }

                // 약간의 좌우 움직임
                this.x += Math.sin(Date.now() * 0.001 + this.progress) * 0.5;

                // 차선 유지
                const targetX = canvas.width/2 - 150 + this.lane * 75 + 37.5;
                this.x += (targetX - this.x) * 0.02;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                // AI 자동차 몸체
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);

                // 창문
                ctx.fillStyle = '#87CEEB';
                ctx.fillRect(-this.width/2 + 2, -this.height/2 + 3, this.width - 4, 12);

                // 바퀴
                ctx.fillStyle = '#000';
                ctx.fillRect(-this.width/2 - 1, -this.height/2 + 3, 3, 6);
                ctx.fillRect(this.width/2 - 2, -this.height/2 + 3, 3, 6);
                ctx.fillRect(-this.width/2 - 1, this.height/2 - 9, 3, 6);
                ctx.fillRect(this.width/2 - 2, this.height/2 - 9, 3, 6);

                ctx.restore();
            }
        }

        // 트랙 요소
        class TrackElement {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type; // 'line', 'tree', 'sign'
                this.speed = 4;
            }

            update() {
                this.y += this.speed;
                if (this.y > canvas.height + 20) {
                    this.y = -20;
                }
            }

            draw() {
                if (this.type === 'line') {
                    ctx.fillStyle = '#ffff00';
                    ctx.fillRect(this.x - 2, this.y - 10, 4, 20);
                } else if (this.type === 'tree') {
                    ctx.fillStyle = '#228B22';
                    ctx.fillRect(this.x - 5, this.y - 5, 10, 10);
                } else if (this.type === 'sign') {
                    ctx.fillStyle = '#ff0000';
                    ctx.fillRect(this.x - 3, this.y - 8, 6, 16);
                }
            }
        }

        // 게임 객체들
        const player = new Player();
        const aiCars = [];
        const trackElements = [];

        // AI 자동차 생성
        const carColors = ['#0000ff', '#00ff00', '#ffff00', '#ff8800', '#ff00ff'];
        for (let i = 0; i < 5; i++) {
            const lane = i % 4;
            const x = canvas.width/2 - 150 + lane * 75 + 37.5;
            const y = -100 - i * 100;
            const speed = 3 + Math.random() * 2;
            aiCars.push(new AICar(x, y, carColors[i], speed));
        }

        // 트랙 요소 생성
        for (let i = 0; i < 20; i++) {
            // 중앙선
            trackElements.push(new TrackElement(canvas.width/2, i * 50, 'line'));
            
            // 나무들
            if (i % 3 === 0) {
                trackElements.push(new TrackElement(canvas.width/2 - 200, i * 80, 'tree'));
                trackElements.push(new TrackElement(canvas.width/2 + 200, i * 80, 'tree'));
            }
        }

        // 트랙 그리기
        function drawTrack() {
            // 트랙 배경
            ctx.fillStyle = '#666666';
            ctx.fillRect(canvas.width/2 - 150, 0, 300, canvas.height);

            // 트랙 경계선
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(canvas.width/2 - 152, 0, 4, canvas.height);
            ctx.fillRect(canvas.width/2 + 148, 0, 4, canvas.height);

            // 차선
            for (let i = 1; i < 4; i++) {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(canvas.width/2 - 150 + i * 75 - 1, 0, 2, canvas.height);
            }
        }

        // 위치 계산
        function calculatePosition() {
            let position = 1;
            aiCars.forEach(car => {
                if (car.progress > gameState.trackProgress + (gameState.currentLap - 1)) {
                    position++;
                }
            });
            gameState.position = position;
        }

        // 게임 루프
        function gameLoop() {
            if (!gameState.gameRunning) return;

            // 시간 업데이트
            gameState.time += 1/60;

            // 화면 지우기
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 배경 그라데이션
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#87CEEB');
            gradient.addColorStop(0.4, '#87CEEB');
            gradient.addColorStop(0.4, '#228B22');
            gradient.addColorStop(1, '#228B22');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 트랙 그리기
            drawTrack();

            // 트랙 요소 업데이트 및 그리기
            trackElements.forEach(element => {
                element.update();
                element.draw();
            });

            // 게임 객체 업데이트
            player.update();
            aiCars.forEach(car => car.update());

            // 위치 계산
            calculatePosition();

            // 점수 계산 (속도와 위치에 따라)
            gameState.score += Math.floor(Math.abs(player.speed)) + (6 - gameState.position);

            // 그리기
            aiCars.forEach(car => car.draw());
            player.draw();

            // HUD 업데이트
            document.getElementById('score').textContent = gameState.score;
            document.getElementById('time').textContent = Math.floor(gameState.time);
            document.getElementById('currentLap').textContent = gameState.currentLap;
            document.getElementById('position').textContent = gameState.position;

            requestAnimationFrame(gameLoop);
        }

        // 키보드 이벤트
        document.addEventListener('keydown', (e) => {
            gameState.keys[e.code] = true;
            e.preventDefault();
        });

        document.addEventListener('keyup', (e) => {
            gameState.keys[e.code] = false;
            e.preventDefault();
        });

        // 레이스 완료
        function finishRace() {
            gameState.gameRunning = false;
            gameState.raceFinished = true;
            
            // 최종 점수 보너스
            const positionBonus = (6 - gameState.position) * 1000;
            const timeBonus = Math.max(0, 180 - Math.floor(gameState.time)) * 10;
            gameState.score += positionBonus + timeBonus;

            document.getElementById('finalTime').textContent = Math.floor(gameState.time);
            document.getElementById('finalPosition').textContent = gameState.position;
            document.getElementById('finalScore').textContent = gameState.score;
            document.getElementById('gameOver').style.display = 'block';
        }

        // 게임 재시작
        function restartGame() {
            gameState.score = 0;
            gameState.time = 0;
            gameState.currentLap = 1;
            gameState.position = 1;
            gameState.gameRunning = true;
            gameState.raceFinished = false;
            gameState.trackProgress = 0;
            
            player.x = canvas.width / 2;
            player.y = canvas.height - 100;
            player.speed = 0;
            player.angle = 0;
            player.turnSpeed = 0;

            // AI 자동차 리셋
            aiCars.forEach((car, index) => {
                car.y = -100 - index * 100;
                car.progress = Math.random();
            });

            document.getElementById('gameOver').style.display = 'none';
            gameLoop();
        }

        // 게임 시작
        gameLoop();
    </script>
</body>
</html>
